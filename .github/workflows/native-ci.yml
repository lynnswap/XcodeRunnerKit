name: Xcode CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request replaces its running checks. Other runs get
# their own group, so no main commit loses its run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  xcode:
    if: github.repository == 'lynnswap/XcodeRunnerKit'
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the checkout CLI
        run: |
          exec xcodebuild build \
            -scheme XcodeRunnerKit-Package \
            -destination 'platform=macOS,arch=arm64' \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/XcodeRunnerKit-cli" \
            -jobs 3
      - name: Check host storage setup and cleanup
        run: python3 Scripts/check-host-setup.py "$RUNNER_TEMP/XcodeRunnerKit-cli/Build/Products/Release/xcode-runner"
      - name: Test macOS library and CLI
        run: |
          "$RUNNER_TEMP/XcodeRunnerKit-cli/Build/Products/Release/xcode-runner" pool configure \
            --pool-directory "$RUNNER_TEMP/Pool" --maximum-concurrent-jobs 2
          exec "$RUNNER_TEMP/XcodeRunnerKit-cli/Build/Products/Release/xcode-runner" test \
            --package "$GITHUB_WORKSPACE" --scheme XcodeRunnerKit-Package \
            --destination 'platform=macOS,arch=arm64' \
            --pool-directory "$RUNNER_TEMP/Pool" \
            --compilation-cache "$RUNNER_TEMP/CompilationCache" \
            --output-directory "$RUNNER_TEMP/XcodeRunnerKit-macos" \
            -- -parallel-testing-enabled NO -jobs 3
      - name: Check common runner host processes
        run: python3 Scripts/check-runner-host.py "$RUNNER_TEMP/XcodeRunnerKit-cli/Build/Products/Release/xcode-runner-host"
      - name: Check separate-process capacity
        run: python3 Scripts/check-execution-pool.py
      - name: Check pool administration and Xcode CLI commands
        run: exec python3 Scripts/check-pool-cli.py "$RUNNER_TEMP/XcodeRunnerKit-cli/Build/Products/Release/xcode-runner"
      - name: Check MCP settings discovery and updates
        run: python3 Scripts/check-settings-mcp.py "$RUNNER_TEMP/XcodeRunnerKit-cli/Build/Products/Release/xcode-runner"
      - name: Check cancellation through shell wrappers
        run: python3 Scripts/check-cancellation.py "$RUNNER_TEMP/XcodeRunnerKit-cli/Build/Products/Release/xcode-runner"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: xcode-results
          path: |
            ${{ runner.temp }}/XcodeRunnerKit-macos/*/xcodebuild.log
            ${{ runner.temp }}/XcodeRunnerKit-macos/*/Results.xcresult
          retention-days: 1
          if-no-files-found: ignore
