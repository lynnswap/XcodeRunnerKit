name: Native Xcode CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    if: github.repository == 'lynnswap/XcodeRunnerKit'
    runs-on: [self-hosted, macOS, ARM64, xcode-runnerkit]
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test macOS library and CLI
        run: |
          ci_root="$HOME/Library/Application Support/XcodeRunnerKit"
          cat "$ci_root/bin/xcode-runner.commit"
          "$ci_root/bin/xcode-runner" test \
            --package "$GITHUB_WORKSPACE" --scheme XcodeRunnerKit-Package \
            --destination 'platform=macOS,arch=arm64' \
            --pool-directory "$ci_root/Pool" --maximum-concurrent-jobs 2 \
            --compilation-cache "$ci_root/CompilationCache" \
            --output-directory "$RUNNER_TEMP/XcodeRunnerKit-macos" \
            -- -parallel-testing-enabled NO -jobs 4
      - name: Check separate-process capacity
        run: python3 Scripts/check-execution-pool.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-macos-results
          path: |
            ${{ runner.temp }}/XcodeRunnerKit-macos/*/xcodebuild.log
            ${{ runner.temp }}/XcodeRunnerKit-macos/*/Results.xcresult
          retention-days: 1
          if-no-files-found: ignore

  ios:
    if: github.repository == 'lynnswap/XcodeRunnerKit'
    runs-on: [self-hosted, macOS, ARM64, xcode-runnerkit]
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the iOS consumer fixture
        run: |
          ci_root="$HOME/Library/Application Support/XcodeRunnerKit"
          "$ci_root/bin/xcode-runner" test \
            --package "$GITHUB_WORKSPACE/Tests/Fixtures/BuildProbe" --scheme BuildProbe \
            --simulator-runtime com.apple.CoreSimulator.SimRuntime.iOS-27-0 \
            --simulator-device-type com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro \
            --pool-directory "$ci_root/Pool" --maximum-concurrent-jobs 2 \
            --compilation-cache "$ci_root/CompilationCache" \
            --output-directory "$RUNNER_TEMP/XcodeRunnerKit-ios" \
            -- -jobs 4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-ios-results
          path: |
            ${{ runner.temp }}/XcodeRunnerKit-ios/*/xcodebuild.log
            ${{ runner.temp }}/XcodeRunnerKit-ios/*/Results.xcresult
          retention-days: 1
          if-no-files-found: ignore
